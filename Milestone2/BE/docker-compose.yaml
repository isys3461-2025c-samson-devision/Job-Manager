version: "3.9"

name: jobapp-be

services:
  # Auth Service 
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: jobapp-auth-service
    ports:
      - "3001:3001"
    env_file:
      - services/auth-service/.env
    restart: unless-stopped

  # Profile Service 
  profile-service:
    build:
      context: .
      dockerfile: services/profile-service/Dockerfile
    container_name: jobapp-profile-service
    ports:
      - "3002:3002"
    env_file:
      - services/profile-service/.env
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKERS=kafka:9092
    networks:
      - app-network

  # Search Profile Service 
  search-profile-service:
    build:
      context: .
      dockerfile: services/search-profile-service/Dockerfile
    container_name: jobapp-search-service
    ports:
      - "3009:3009"
    env_file:
      - services/search-profile-service/.env
    restart: unless-stopped

      # Notification Service (NEW)
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: jobapp-notification-service
    ports:
      - "3003:3003"
    env_file:
      - services/notification-service/.env
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKERS=kafka:9092
    networks:
      - app-network


  # Kafka & ZooKeeper (NEW)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: jobapp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: jobapp-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - app-network

  # Kafka UI 
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: jobapp-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - app-network
networks:
  app-network:
    driver: bridge